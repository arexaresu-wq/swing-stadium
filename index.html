<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スマホ素振りスタジアム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#2a5e42; --board-deep:#1b4430; --panel:#22523a; --chalk:#f5f4ee; --chalk-dim:#b3cbbd;
  --lamp-off:#143624; --strike:#f2c230; --out:#e5483b; --hit:#8be394; --line:rgba(245,244,238,.22);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --board:#1d4631; --board-deep:#0f2a1d; --panel:#173a28; --lamp-off:#0b2116; }
}
:root[data-theme="dark"]{ --board:#1d4631; --board-deep:#0f2a1d; --panel:#173a28; --lamp-off:#0b2116; }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--board-deep);color:var(--chalk);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:520px;margin:0 auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.display{font-family:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:400;letter-spacing:.02em}

.board{background:var(--board);border:3px solid var(--line);border-radius:4px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.board h1{grid-column:1/-1;margin:0;font-size:1.05rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.lamps{display:grid;grid-template-columns:auto auto auto;gap:6px 8px;align-items:center}
.lamps b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:1.1rem;width:1.2em}
.lamp{width:18px;height:18px;border-radius:50%;background:var(--lamp-off);box-shadow:inset 0 2px 3px rgba(0,0,0,.45)}
.lamp.s.on{background:var(--strike);box-shadow:0 0 10px var(--strike)}
.lamp.o.on{background:var(--out);box-shadow:0 0 10px var(--out)}
.stats{margin:0;display:flex;justify-content:flex-end;gap:14px}
.stats div{text-align:center}
.stats dt{font-size:.72rem;color:var(--chalk-dim)}
.stats dd{margin:0;font-family:"Dela Gothic One",sans-serif;font-size:1.6rem;line-height:1.1}

.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.panel{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px}
.panel h2{margin:0;font-size:1.5rem}
.panel p{margin:0;line-height:1.75}
.steps{margin:0;padding-left:1.4em;line-height:1.9}
.steps em{font-style:normal;font-weight:700;color:var(--strike)}
.note{font-size:.88rem;color:var(--chalk-dim);border-left:3px solid var(--strike);padding-left:10px}
.err{font-size:.9rem;border-left:3px solid var(--out);padding-left:10px}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
button{font:inherit;font-weight:700;border-radius:6px;padding:14px 16px;cursor:pointer;min-height:48px}
button:focus-visible{outline:3px solid var(--strike);outline-offset:2px}
.primary{background:var(--strike);color:#15301f;border:0;font-size:1.05rem}
.ghost{background:transparent;color:var(--chalk);border:1px solid var(--chalk-dim)}
.dots{display:flex;gap:14px}
.dots i{width:38px;height:38px;border-radius:50%;border:2px solid var(--chalk-dim)}
.dots i.done{background:var(--chalk);border-color:var(--chalk)}

.play{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.view{flex:1;min-height:180px;position:relative;border-radius:4px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 12%,#3b7a55 0%,var(--panel) 55%,var(--board-deep) 100%);border:1px solid var(--line)}
.zone{position:absolute;left:50%;top:72%;width:34%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:2px dashed var(--line)}
.mound{position:absolute;left:50%;top:14%;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(245,244,238,.12)}
.ball{position:absolute;left:50%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dcd8cc);
  box-shadow:0 4px 14px rgba(0,0,0,.35);transform:translate(-50%,-50%) scale(.1);opacity:0}
#fieldView{position:absolute;inset:0;width:100%;height:100%}
.msg{margin:0;text-align:center;font-size:clamp(2.2rem,12vw,3.6rem);line-height:1.15;min-height:1.2em}
.msg.big{color:var(--strike)}
.msg.good{color:var(--hit)}
.msg.bad{color:var(--chalk-dim)}
.detail{margin:0;text-align:center;font-size:.92rem;color:var(--chalk-dim);min-height:2.8em;line-height:1.5}
.tapHint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.85rem;color:var(--chalk-dim)}

.controls{display:flex;flex-direction:column;gap:8px}
.meter{height:10px;background:var(--lamp-off);border-radius:5px;overflow:hidden;position:relative}
.meter span{display:block;height:100%;width:0;background:var(--hit)}
.meter .th{position:absolute;top:0;bottom:0;width:2px;background:var(--strike)}
.meterLabel{font-size:.75rem;color:var(--chalk-dim);display:flex;justify-content:space-between}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{padding:10px;min-height:44px}
@media (prefers-reduced-motion: reduce){ .lamp{transition:none} }
</style>
</head>
<body>
<div class="app">
  <header class="board">
    <h1 class="display">スマホ素振りスタジアム</h1>
    <div class="lamps" aria-label="カウント">
      <b>S</b><i class="lamp s"></i><i class="lamp s"></i>
      <b>O</b><i class="lamp o"></i><i class="lamp o"></i>
    </div>
    <dl class="stats">
      <div><dt>打席</dt><dd id="stPa">0</dd></div>
      <div><dt>安打</dt><dd id="stHit">0</dd></div>
      <div><dt>本塁打</dt><dd id="stHr">0</dd></div>
    </dl>
  </header>

  <main class="stage">
    <section id="intro" class="panel">
      <h2 class="display">音を聞いて、スマホで打つ</h2>
      <ol class="steps">
        <li><em>ピッ</em>でピッチャーが構える</li>
        <li><em>パン</em>で投球</li>
        <li><em>シュー</em>が一番大きくなった瞬間にスマホを振る</li>
      </ol>
      <p>早く振れば引っ張り、遅れれば流し打ち。3アウトでゲームセットです。</p>
      <p class="note">ストラップを手首に通し、周りに人や物がないことを確かめてから振ってください。マナーモードだと音が鳴らないことがあります。</p>
      <div class="actions">
        <button class="primary" id="btnSensor">センサーを許可して始める</button>
        <button class="ghost" id="btnTap">画面タップで遊ぶ</button>
      </div>
    </section>

    <section id="calib" class="panel" hidden>
      <h2 class="display">素振りを3回</h2>
      <p>いつもの強さで3回振ってください。振りの速さに合わせて感度を調整します。</p>
      <div class="dots"><i></i><i></i><i></i></div>
      <p id="calibInfo" class="detail" style="text-align:left"></p>
      <p id="sensorErr" class="err" hidden></p>
      <p id="sensorDiag" class="detail" style="text-align:left;font-size:.78rem" hidden></p>
      <div class="actions">
        <button class="primary" id="btnOpen" hidden>別の画面で開く</button>
        <button class="primary" id="btnBat" hidden>打席に入る</button>
        <button class="ghost" id="btnSkip">調整せずに打席に入る</button>
        <button class="ghost" id="btnTap2" hidden>画面タップで遊ぶ</button>
      </div>
    </section>

    <section id="play" class="play" hidden>
      <div class="view" id="view">
        <div id="pitchView">
          <div class="mound"></div>
          <div class="zone"></div>
          <div class="ball" id="ball"></div>
        </div>
        <svg id="fieldView" viewBox="-135 -132 270 142" preserveAspectRatio="xMidYMid meet" hidden aria-label="打球方向">
          <path d="M0 0 L-95 -95 M0 0 L95 -95" stroke="rgba(245,244,238,.55)" stroke-width="1.2"/>
          <path d="M-84.85 -84.85 A120 120 0 0 1 84.85 -84.85" fill="none" stroke="rgba(245,244,238,.8)" stroke-width="2"/>
          <path d="M0 0 L19 -19 L0 -38 L-19 -19 Z" fill="rgba(160,110,60,.35)" stroke="rgba(245,244,238,.4)" stroke-width=".8"/>
          <text x="-70" y="-28" fill="rgba(245,244,238,.5)" font-size="9" text-anchor="middle">レフト</text>
          <text x="0" y="-100" fill="rgba(245,244,238,.5)" font-size="9" text-anchor="middle">センター</text>
          <text x="70" y="-28" fill="rgba(245,244,238,.5)" font-size="9" text-anchor="middle">ライト</text>
          <line id="traj" x1="0" y1="0" x2="0" y2="0" stroke="#f5f4ee" stroke-width="1.4" stroke-dasharray="3 3"/>
          <circle id="dot" cx="0" cy="0" r="4.5" fill="#f2c230"/>
        </svg>
        <p class="tapHint" id="tapHint" hidden>タイミングよく画面をタップ（スペースキーでも可）</p>
      </div>
      <p id="msg" class="msg display"></p>
      <p id="detail" class="detail"></p>
    </section>

    <section id="over" class="panel" hidden>
      <h2 class="display">ゲームセット</h2>
      <p id="overStats" style="font-size:1.15rem"></p>
      <div class="actions">
        <button class="primary" id="btnAgain">もう一度プレイ</button>
      </div>
    </section>
  </main>

  <footer class="controls" id="controls" hidden>
    <div id="meterBox">
      <div class="meterLabel"><span>スイング速度</span><span id="meterVal">0°/s</span></div>
      <div class="meter"><span id="meter"></span><i class="th" id="meterTh"></i></div>
    </div>
    <div class="btns">
      <button class="ghost" id="btnPause">一時停止</button>
      <button class="ghost" id="btnRecal">素振りし直す</button>
    </div>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const METER_MAX = 2200;

let ctx = null, noiseBuf = null;
let mode = 'sensor';          // 'sensor' | 'tap'
let phase = 'intro';          // intro | calib | wait | pitch | over
let threshold = 350, refPeak = 1100;
let gotMotion = false, curMag = 0, listening = false;
let above = false, peak = 0, peakT = 0, lastSwingAt = -1e9;
let calibPeaks = [];
let game = null, pitch = null, paused = false, nextTimer = null, wakeLock = null;

/* ---------- audio ---------- */
function initAudio(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const len = ctx.sampleRate;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  }
  if(ctx.state === 'suspended') ctx.resume();
  const o = ctx.createOscillator(), g = ctx.createGain();
  g.gain.value = 0; o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .02);
}
function tone(t, freq, dur, vol=.3, type='sine'){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .005);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + .02);
  return o;
}
function noise(t, dur, {f0=1000, f1=f0, q=1, v0=.3, v1=.0001, type='bandpass'} = {}){
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ctx.createGain(); g.gain.setValueAtTime(v0, t); g.gain.exponentialRampToValueAtTime(v1, t + dur);
  s.connect(f).connect(g).connect(ctx.destination); s.start(t); s.stop(t + dur + .01);
  return s;
}
const sndSet = t => { tone(t, 1320, .1, .25); };
const sndRelease = t => { noise(t, .07, {f0:2000, f1:500, q:.7, v0:.6}); tone(t, 160, .09, .35, 'triangle'); };
const sndWhoosh = (t0, t1) => noise(t0, t1 - t0, {f0:400, f1:3200, q:1.5, v0:.01, v1:.8});
const sndMitt = t => [noise(t, .07, {f0:1200, f1:250, q:.9, v0:.9, type:'lowpass'}), tone(t, 110, .08, .5, 'triangle')];
function sndCrack(k){
  const t = ctx.currentTime;
  noise(t, .1, {f0:800 + 3500*k, f1:1200, q:.6, v0:.1 + .9*k});
  tone(t, 400 + 1800*k, .05, .3, 'square');
  tone(t, 900, .18, .05 + .15*k, 'triangle');
}
const sndWhiff = () => noise(ctx.currentTime, .22, {f0:250, f1:900, q:1.2, v0:.25, v1:.001});
const sndCheer = () => noise(ctx.currentTime + .3, 2.2, {f0:600, f1:1500, q:.4, v0:.35, v1:.001});

function say(text){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 1.15; speechSynthesis.speak(u); }catch(e){}
}
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

/* ---------- sensor ---------- */
function onMotion(e){
  const r = e.rotationRate; if(!r) return;
  const a = r.alpha||0, b = r.beta||0, g = r.gamma||0;
  if(a===0 && b===0 && g===0 && !gotMotion) return;
  gotMotion = true;
  const m = Math.hypot(a, b, g); curMag = m;
  const t = performance.now();
  const th = phase === 'calib' ? 250 : threshold;
  if(m > th){
    if(!above){ above = true; peak = 0; }
    if(m > peak){ peak = m; peakT = t; }
  } else if(above){
    above = false; onSwing(peakT, peak);
  }
}
function onSwing(t, pk){
  if(t - lastSwingAt < 700) return;
  lastSwingAt = t;
  if(phase === 'calib') return calibSwing(pk);
  if(phase === 'pitch') judgeSwing(t, pk);
}
const inFrame = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
function startSensor(){
  // iOSでは、ボタンを押した直後に何よりも先に許可を求める必要がある
  let permPromise = Promise.resolve('not-needed');
  if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
    try{ permPromise = DeviceMotionEvent.requestPermission(); }
    catch(e){ permPromise = Promise.resolve('error: ' + (e && e.message || e)); }
  }
  // 結果を待たずに受信を始める（「拒否」と返っても実際には値が届く環境がある）
  if(!listening){ window.addEventListener('devicemotion', onMotion); listening = true; }
  initAudio();
  mode = 'sensor';
  enterCalib();
  $('calibInfo').textContent = 'センサーを確認しています…';
  let permResult = '';
  permPromise.then(r => { permResult = String(r); }, e => { permResult = 'error: ' + (e && (e.name || e.message) || e); });
  const started = performance.now();
  (function check(){
    if(gotMotion){ if(!calibPeaks.length) $('calibInfo').textContent = 'センサーOK。素振りしてください。'; return; }
    if(performance.now() - started < 2500) return setTimeout(check, 150);
    sensorFail(permResult);
  })();
}
function sensorFail(permResult){
  let text;
  if(inFrame){
    text = 'claude.aiのページ内に埋め込まれて表示されているため、ブラウザがセンサーの利用をブロックしています。このHTMLファイルを自分のサイト（GitHub Pagesなど、https://で始まるURL）に置いて開くとセンサーで遊べます。ここでは「画面タップで遊ぶ」を使ってください。';
  } else if(/denied/.test(permResult)){
    text = 'センサーの利用が拒否された状態になっています。iPhoneの場合は、このタブを閉じてから開き直し、許可ダイアログで「許可」を選んでください。それでも出る場合は、設定アプリ →「Safari」→「詳細」→「Webサイトデータ」でこのサイトのデータを削除すると、もう一度許可を求められます。';
  } else {
    text = 'この端末ではモーションセンサーの値が取れませんでした。';
  }
  $('sensorErr').textContent = text; $('sensorErr').hidden = false;
  $('sensorDiag').textContent = `診断: 埋め込み表示=${inFrame ? 'はい' : 'いいえ'} ／ 許可結果=${permResult || '応答なし'} ／ HTTPS=${location.protocol === 'https:' ? 'はい' : 'いいえ'}`;
  $('sensorDiag').hidden = false;
  $('btnOpen').hidden = true;
  $('btnTap2').hidden = false; $('btnSkip').hidden = true; $('btnBat').hidden = true;
  $('calibInfo').textContent = '';
}
function openStandalone(){
  const w = window.open(location.href, '_blank');
  if(!w) $('sensorErr').textContent = '別の画面を開けませんでした。共有メニューから「Safariで開く」「ブラウザで開く」を選んでください。';
}

/* ---------- screens ---------- */
function showOnly(id){
  ['intro','calib','play','over'].forEach(s => $(s).hidden = s !== id);
  $('controls').hidden = id !== 'play';
}
function enterCalib(){
  phase = 'calib'; calibPeaks = [];
  showOnly('calib');
  document.querySelectorAll('.dots i').forEach(d => d.classList.remove('done'));
  $('calibInfo').textContent = ''; $('btnBat').hidden = true; $('btnSkip').hidden = false;
  $('sensorErr').hidden = true; $('btnTap2').hidden = true;
  $('sensorDiag').hidden = true; $('btnOpen').hidden = true;
}
function calibSwing(pk){
  if(calibPeaks.length >= 3) return;
  calibPeaks.push(pk);
  document.querySelectorAll('.dots i')[calibPeaks.length-1].classList.add('done');
  $('calibInfo').textContent = `${calibPeaks.length}回目：${Math.round(pk).toLocaleString()}°/s`;
  if(calibPeaks.length === 3){
    refPeak = calibPeaks.reduce((a,b)=>a+b,0) / 3;
    threshold = clamp(refPeak * .45, 250, 700);
    $('calibInfo').textContent = `平均スイング速度 ${Math.round(refPeak).toLocaleString()}°/s。これを基準に飛距離を計算します。`;
    $('btnBat').hidden = false; $('btnSkip').hidden = true;
  }
}
async function startGame(){
  initAudio();
  say('プレイボール');
  try{ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  game = {strikes:0, outs:0, pa:0, hits:0, hr:0};
  paused = false; $('btnPause').textContent = '一時停止';
  renderBoard(); showOnly('play');
  $('tapHint').hidden = mode !== 'tap';
  $('meterBox').hidden = mode !== 'sensor';
  $('btnRecal').hidden = mode !== 'sensor';
  $('meterTh').style.left = (threshold / METER_MAX * 100) + '%';
  setMsg('', ''); $('detail').textContent = '最初の投球を待っています';
  phase = 'wait'; showPitchView();
  scheduleNext(1600);
}
function renderBoard(){
  const g = game || {strikes:0,outs:0,pa:0,hits:0,hr:0};
  document.querySelectorAll('.lamp.s').forEach((l,i) => l.classList.toggle('on', i < g.strikes));
  document.querySelectorAll('.lamp.o').forEach((l,i) => l.classList.toggle('on', i < g.outs));
  $('stPa').textContent = g.pa; $('stHit').textContent = g.hits; $('stHr').textContent = g.hr;
}
function setMsg(text, cls){ const m = $('msg'); m.textContent = text; m.className = 'msg display ' + (cls||''); }
function showPitchView(){ $('pitchView').hidden = false; $('fieldView').hidden = true; }
function showField(angleDeg, dist){
  $('pitchView').hidden = true; $('fieldView').hidden = false;
  const r = angleDeg * Math.PI / 180;
  const x = -Math.sin(r) * dist, y = -Math.cos(r) * dist;
  $('dot').setAttribute('cx', x); $('dot').setAttribute('cy', y);
  $('traj').setAttribute('x2', x); $('traj').setAttribute('y2', y);
}

/* ---------- pitching ---------- */
const PITCHES = [
  {name:'ストレート', travel:.48, w:.5},
  {name:'スライダー', travel:.57, w:.25},
  {name:'チェンジアップ', travel:.68, w:.25},
];
function pickPitch(){ let r = Math.random(); for(const p of PITCHES){ if((r -= p.w) <= 0) return p; } return PITCHES[0]; }
function scheduleNext(ms){ clearTimeout(nextTimer); nextTimer = setTimeout(throwPitch, ms); }
function throwPitch(){
  if(paused || phase !== 'wait') return;
  const p = pickPitch();
  const now = ctx.currentTime;
  const tSet = now + .1;
  const tRel = tSet + .9 + Math.random() * .8;
  const tArr = tRel + p.travel * (.95 + Math.random() * .1);
  sndSet(tSet); sndRelease(tRel); sndWhoosh(tRel, tArr);
  const mitt = sndMitt(tArr);
  const lat = ((ctx.outputLatency || 0) + (ctx.baseLatency || 0)) * 1000;
  const perfNow = performance.now();
  const toPerf = a => perfNow + (a - now) * 1000 + lat;
  pitch = {p, rel:toPerf(tRel), arr:toPerf(tArr), mitt, done:false};
  pitch.timeout = setTimeout(() => { if(pitch && !pitch.done) takePitch(); }, pitch.arr - performance.now() + 140);
  phase = 'pitch'; showPitchView();
  setMsg('', ''); $('detail').textContent = '構えて…';
}
function timingText(d){
  if(Math.abs(d) < 8) return 'タイミング ジャスト';
  return `タイミング ${Math.round(Math.abs(d))}ms ${d < 0 ? '早い' : '遅い'}`;
}
function speedText(pk){ return mode === 'sensor' ? ` ／ スイング ${Math.round(pk).toLocaleString()}°/s` : ''; }

function judgeSwing(t, pk){
  if(!pitch || pitch.done || t < pitch.rel) return;
  const d = t - pitch.arr;
  if(d > 140) return;
  pitch.done = true; clearTimeout(pitch.timeout);
  if(d < -140){
    sndWhiff();
    return strike('空振り', `${timingText(d)}${speedText(pk)}`);
  }
  if(t < pitch.arr) pitch.mitt.forEach(n => { try{ n.stop(); }catch(e){} });
  contact(d, pk);
}
function takePitch(){
  pitch.done = true;
  strike('見逃し', `${pitch.p.name}を見逃し`);
}
function strike(label, detail){
  game.strikes++;
  if(game.strikes >= 3){
    const text = label === '見逃し' ? '見逃し三振' : '三振';
    say(text + '、バッターアウト');
    return endAtBat(text, 'bad', detail, true, false);
  }
  say('ストライク');
  renderBoard(); setMsg(label, 'bad'); $('detail').textContent = detail;
  phase = 'wait'; scheduleNext(2400);
}
function contact(d, pk){
  const q = Math.abs(d);
  const power = mode === 'sensor' ? clamp(pk / refPeak, .5, 1.35) : 1;
  const angle = -d / 100 * 45 + (Math.random() - .5) * 10;
  const detailBase = `${timingText(d)}${speedText(pk)}`;
  buzz(q <= 70 ? [50] : [20]);
  if(q > 100 || Math.abs(angle) > 45){
    sndCrack(.35);
    const fa = Math.sign(angle || -d) * (48 + Math.random() * 10);
    showField(fa, 25 + Math.random() * 45);
    if(game.strikes < 2) game.strikes++;
    say('ファウル'); renderBoard(); setMsg('ファウル', 'bad');
    $('detail').textContent = detailBase;
    phase = 'wait'; return scheduleNext(2600);
  }
  const qf = q <= 35 ? 1 : q <= 70 ? .8 : .55;
  const dist = 125 * qf * power * (.9 + Math.random() * .2);
  sndCrack(clamp(qf * power, .3, 1));
  showField(angle, Math.min(dist, 128));
  const dir = angle > 15 ? 'レフト方向（引っ張り）' : angle < -15 ? 'ライト方向（流し）' : 'センター方向';
  const detail = `${detailBase}\n${dir} ／ 飛距離 ${Math.round(dist)}m`;
  let res, cls = 'good', hit = true, hr = false;
  if(dist >= 120){ res = 'ホームラン'; cls = 'big'; hr = true; sndCheer(); buzz([60,40,60,40,120]); }
  else if(dist >= 95){ res = Math.random() < .2 ? 'スリーベース' : 'ツーベース'; }
  else if(dist >= 60){ if(Math.random() < .7) res = 'ヒット'; else { res = '外野フライ'; hit = false; cls = 'bad'; } }
  else { if(Math.random() < .35) res = '内野安打'; else { res = '内野ゴロ'; hit = false; cls = 'bad'; } }
  say(res + (hr ? '！' : ''));
  endAtBat(res, cls, detail, !hit, hit, hr);
}
function endAtBat(res, cls, detail, isOut, isHit, isHr=false){
  game.pa++; game.strikes = 0;
  if(isOut) game.outs++;
  if(isHit) game.hits++;
  if(isHr) game.hr++;
  renderBoard(); setMsg(res, cls);
  $('detail').style.whiteSpace = 'pre-line'; $('detail').textContent = detail;
  if(game.outs >= 3){
    phase = 'over';
    clearTimeout(nextTimer);
    nextTimer = setTimeout(gameOver, 3200);
    return;
  }
  phase = 'wait'; scheduleNext(isHr ? 4200 : 3400);
}
function gameOver(){
  say('ゲームセット');
  const avg = game.pa ? (game.hits / game.pa).toFixed(3).replace(/^0/, '') : '.000';
  $('overStats').textContent = `${game.pa}打席 ${game.hits}安打（打率${avg}）、ホームラン${game.hr}本`;
  showOnly('over');
  try{ wakeLock && wakeLock.release(); }catch(e){}
}

/* ---------- animation ---------- */
function frame(){
  requestAnimationFrame(frame);
  if(mode === 'sensor' && !$('controls').hidden){
    const v = mode === 'sensor' ? curMag : 0;
    $('meter').style.width = clamp(v / METER_MAX * 100, 0, 100) + '%';
    $('meterVal').textContent = Math.round(v).toLocaleString() + '°/s';
    curMag *= .9;
  }
  const ball = $('ball');
  if(phase === 'pitch' && pitch){
    const now = performance.now();
    if(now < pitch.rel || now > pitch.arr + 60){ ball.style.opacity = 0; return; }
    const s = clamp((now - pitch.rel) / (pitch.arr - pitch.rel), 0, 1);
    ball.style.opacity = 1;
    ball.style.top = (14 + 58 * s * s) + '%';
    ball.style.transform = `translate(-50%,-50%) scale(${.1 + .9 * s * s})`;
  } else ball.style.opacity = 0;
}
requestAnimationFrame(frame);

/* ---------- controls ---------- */
function tapSwing(e){
  if(mode !== 'tap') return;
  if(e && e.type === 'pointerdown') e.preventDefault();
  onSwing(performance.now(), refPeak);
}
$('btnSensor').addEventListener('click', startSensor);
$('btnOpen').addEventListener('click', openStandalone);
function goTap(){ initAudio(); mode = 'tap'; if(listening){ window.removeEventListener('devicemotion', onMotion); listening = false; } startGame(); }
$('btnTap').addEventListener('click', goTap);
$('btnTap2').addEventListener('click', goTap);
$('btnBat').addEventListener('click', startGame);
$('btnSkip').addEventListener('click', () => { threshold = 350; refPeak = 1100; startGame(); });
$('btnAgain').addEventListener('click', () => { if(mode === 'sensor' && !gotMotion) mode = 'tap'; startGame(); });
$('btnRecal').addEventListener('click', () => { clearTimeout(nextTimer); if(pitch) clearTimeout(pitch.timeout); pitch = null; enterCalib(); });
$('btnPause').addEventListener('click', () => {
  paused = !paused;
  $('btnPause').textContent = paused ? '再開' : '一時停止';
  if(paused){ clearTimeout(nextTimer); $('detail').textContent = '一時停止中'; }
  else if(phase === 'wait'){ initAudio(); $('detail').textContent = '次の投球を待っています'; scheduleNext(1200); }
});
$('view').addEventListener('pointerdown', tapSwing);
document.addEventListener('keydown', e => { if(e.code === 'Space' && mode === 'tap' && !$('play').hidden){ e.preventDefault(); tapSwing(); } });
document.addEventListener('visibilitychange', () => {
  if(document.hidden && !$('play').hidden && !paused){ $('btnPause').click(); }
});
</script>
